services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_GROQ_API_KEY: ${VITE_GROQ_API_KEY}
        VITE_GROQ_MODEL: ${VITE_GROQ_MODEL}
        VITE_SHEETS_WEBHOOK_URL: ${VITE_SHEETS_WEBHOOK_URL}
        VITE_WEBHOOK_SECRET: ${VITE_WEBHOOK_SECRET}
    container_name: siapnikah_frontend
    ports:
      - "5173:5173"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    # Uncomment the line below if you want to load environment variables from a .env file
    # env_file:
    #   - .env
